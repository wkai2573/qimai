name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也可以在 Actions 頁面手動觸發
  workflow_dispatch:

# GitHub Pages 部署需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的 push 會取消進行中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        # 這裡的 --base-href 由 package.json 的 build:pages 腳本提供
        run: bun run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Angular 22 的輸出目錄結構
          path: dist/qimai/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
